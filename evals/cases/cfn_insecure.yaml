# expect: TG-CFN-SG-201, TG-CFN-RDS-202, TG-CFN-LAMBDA-203, TG-CFN-IAM-201, TG-CFN-S3-102, TG-CFN-LAMBDA-201
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  Encrypted:
    Type: String
    Default: "false"
Resources:
  Web:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: web
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 1024
          CidrIp: 0.0.0.0/0
  Db:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      StorageEncrypted: !Ref Encrypted
  Worker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.7
      Handler: app.handler
      Environment:
        Variables:
          DB_PASSWORD: hunter2hunter2
  Admin:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: all
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
  Site:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
