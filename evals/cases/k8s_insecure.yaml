# expect: TG-K8S-001, TG-K8S-004, TG-K8S-006, TG-K8S-007, TG-K8S-008, TG-K8S-POD-401, TG-K8S-POD-402, TG-K8S-API-407, TG-K8S-API-426, TG-K8S-ETCD-402, TG-K8S-KUBELET-404, TG-K8S-ING-402, TG-K8S-RBAC-403, TG-K8S-RBAC-404, TG-K8S-003
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: tools
spec:
  selector:
    matchLabels: {app: kubernetes-dashboard}
  template:
    metadata:
      labels: {app: kubernetes-dashboard}
    spec:
      hostPID: true
      containers:
      - name: dashboard
        image: kubernetesui/dashboard:v2.7.0
        securityContext:
          capabilities:
            add: [SYS_ADMIN]
      volumes:
      - name: sock
        hostPath:
          path: /var/run/docker.sock
---
apiVersion: v1
kind: Pod
metadata:
  name: control-plane
  namespace: kube-system
spec:
  containers:
  - name: apiserver
    image: registry.k8s.io/kube-apiserver:v1.30.0
    command: [kube-apiserver, --authorization-mode=AlwaysAllow]
  - name: etcd
    image: registry.k8s.io/etcd:3.5.12-0
    command: [etcd, --cert-file=/pki/etcd.crt, --key-file=/pki/etcd.key]
  - name: kubelet
    image: registry.k8s.io/kubelet:v1.30.0
    command: [kubelet, --anonymous-auth=false]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: open}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects:
- {kind: Group, name: system:anonymous, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: role-admin}
rules:
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles, clusterrolebindings]
  verbs: [bind, escalate]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      content_by_lua_block { ngx.say("hi") }
spec:
  rules:
  - host: shop.example.com
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec:
  type: LoadBalancer
  ports:
  - port: 443
