# expect: TG-ANS-SHELL-001, TG-ANS-TLS-001, TG-ANS-SG-001
- hosts: all
  tasks:
    - name: install
      ansible.builtin.shell: curl -fsSL https://get.example.com | sh
    - name: fetch
      ansible.builtin.get_url:
        url: https://example.com/x.tgz
        dest: /tmp/x.tgz
        validate_certs: false
    - name: sg
      amazon.aws.ec2_security_group:
        name: web
        description: web
        rules:
          - { proto: tcp, ports: [22], cidr_ip: 0.0.0.0/0 }
