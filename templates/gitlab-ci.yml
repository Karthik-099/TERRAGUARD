# TerraGuard for GitLab CI. Copy into .gitlab-ci.yml (or `include:` it).
# Findings appear in the merge request widget (Code Quality) and test report (JUnit).
terraguard:
  stage: test
  image:
    name: ghcr.io/karthik-099/terraguard:latest
    entrypoint: [""]
  script:
    - terraguard scan . --junit terraguard-junit.xml --codequality gl-code-quality.json --markdown terraguard.md
  artifacts:
    when: always
    reports:
      junit: terraguard-junit.xml
      codequality: gl-code-quality.json
    paths: [terraguard.md]
  rules:
    - changes: ["**/*.tf", "**/*.tfvars", ".terraguard.yml"]

# Optional: adopt on an existing codebase without fixing everything first.
# 1. Run once locally: terraguard scan . --write-baseline .terraguard-baseline.json and commit it.
# 2. Add --baseline .terraguard-baseline.json to the script above; only new findings fail the job.

# Optional: TerraGuard findings as merge request threads with "Apply suggestion" fixes.
# Off by default. To turn it on, in Settings > CI/CD > Variables:
# 1. Create a project access token (Settings > Access tokens) with the Reporter role and the api scope,
#    and store it as TERRAGUARD_GITLAB_TOKEN: masked, not protected (merge request branches are
#    usually unprotected). CI_JOB_TOKEN cannot create merge request threads.
# 2. Add TERRAGUARD_MR_COMMENTS with the value "true".
# Each run retires earlier TerraGuard threads. Posting problems print a warning and never fail the pipeline.
terraguard-mr-comments:
  stage: test
  image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f # alpine:3.22
  variables:
    GIT_DEPTH: "0" # the review compares with the merge request's base commit
    TERRAGUARD_VERSION: v3.2.0
    TERRAGUARD_PATH: "."
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $TERRAGUARD_MR_COMMENTS == "true" && $TERRAGUARD_GITLAB_TOKEN
      changes: ["**/*.tf", "**/*.tfvars", ".terraguard.yml"]
  script:
    - |
      set +e
      warn() { echo "WARNING: TerraGuard: $1" >&2; }
      api() { curl -fsS -H "PRIVATE-TOKEN: $TERRAGUARD_GITLAB_TOKEN" "$@"; }
      marker='<!-- terraguard-review -->'
      mr="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"
      apk add --no-cache git curl jq > /dev/null || { warn "could not install git, curl and jq"; exit 0; }
      rel="https://github.com/Karthik-099/TERRAGUARD/releases/download/$TERRAGUARD_VERSION"
      cd /tmp && curl -fsSLO "$rel/terraguard_linux_amd64" && curl -fsSLO "$rel/checksums.txt" &&
        grep ' terraguard_linux_amd64$' checksums.txt > sum.txt && sha256sum -c sum.txt && chmod +x terraguard_linux_amd64 ||
        { warn "could not download and verify terraguard $TERRAGUARD_VERSION"; exit 0; }
      cd "$CI_PROJECT_DIR"
      /tmp/terraguard_linux_amd64 review "$TERRAGUARD_PATH" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --format gitlab-review --out /tmp/review.json > /dev/null
      jq -e '.discussions' /tmp/review.json > /dev/null 2>&1 || { warn "could not build the review"; exit 0; }
      # Position the threads on the merge request's latest diff version when GitLab reports it.
      refs=$(api "$mr" | jq -c '.diff_refs // empty')
      if [ -n "$refs" ]; then
        jq --argjson r "$refs" '.discussions[].position += {base_sha: $r.base_sha, start_sha: $r.start_sha, head_sha: $r.head_sha}' /tmp/review.json > /tmp/review.pos && mv /tmp/review.pos /tmp/review.json
      fi
      # Earlier TerraGuard threads, found by the marker and this token's user, listed before posting.
      me=$(api "$CI_API_V4_URL/user" | jq -r '.id // empty')
      : > /tmp/old.txt
      page=1
      while [ -n "$me" ]; do
        r=$(api "$mr/discussions?per_page=100&page=$page") || { warn "could not list earlier threads"; break; }
        [ "$(printf '%s' "$r" | jq 'length')" -gt 0 ] || break
        # Delete a thread nobody else replied to; resolve one with replies so people keep their words.
        printf '%s' "$r" | jq -r --arg m "$marker" --argjson me "$me" '.[]
          | select((.id | test("^[0-9a-f]+$")) and .notes[0].author.id == $me and (.notes[0].body | contains($m)))
          | "\(.id) \(.notes[0].id) \(if all(.notes[]; .author.id == $me) then "delete" else "resolve" end)"' >> /tmp/old.txt
        page=$((page + 1))
      done
      post() { api -X POST -H "Content-Type: application/json" --data-binary @- "$mr/discussions" > /dev/null; }
      if [ "$(jq '.discussions | length' /tmp/review.json)" -gt 0 ]; then
        jq -c '{body: .body}' /tmp/review.json | post || warn "could not post the summary thread"
      else
        echo "No new finding on a changed line; no threads posted."
      fi
      jq -c '.discussions[]' /tmp/review.json | while read -r d; do
        # A line GitLab does not show in the diff is rejected; post the finding as a plain thread instead.
        printf '%s' "$d" | post || printf '%s' "$d" | jq -c '{body: .body}' | post || warn "could not post a thread"
      done
      while read -r did nid act; do
        if [ "$act" = delete ]; then
          api -X DELETE "$mr/discussions/$did/notes/$nid" > /dev/null || warn "could not delete an earlier TerraGuard thread"
        else
          api -X PUT "$mr/discussions/$did?resolved=true" > /dev/null || warn "could not resolve an earlier TerraGuard thread"
        fi
      done < /tmp/old.txt
      exit 0
