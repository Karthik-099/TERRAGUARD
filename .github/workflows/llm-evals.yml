# Manual only: benchmark a free LLM against the labelled rule cases.
# Add GROQ_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY as repository secrets.
name: llm-evals

on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [groq, gemini, openrouter]
        default: groq
      model:
        description: Model id (blank = provider default)
        required: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Evaluate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Inputs go through the environment, never into the script text (no injection).
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
        run: |
          args=(--provider "$PROVIDER" --summary "$GITHUB_STEP_SUMMARY")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          go run ./evals/llmeval "${args[@]}"
