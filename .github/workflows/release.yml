# Runs only when you push a version tag: git tag v2.0.0 && git push origin v2.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write      # publish the Docker image to GHCR
  id-token: write      # keyless signing (cosign) and provenance, via GitHub OIDC
  attestations: write  # build provenance for binaries and the image

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=$([ "$os" = windows ] && echo .exe || true)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/terraguard_${os}_${arch}${ext}" ./cmd/terraguard
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package VS Code extension
        run: |
          cp LICENSE editors/vscode/LICENSE
          cd editors/vscode
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" >/dev/null
          npx --yes @vscode/vsce@3.2.1 package --no-dependencies -o "../../dist/terraguard-${GITHUB_REF_NAME#v}.vsix"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/terraguard.spdx.json
          upload-artifact: false
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Build provenance for every artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "TerraGuard $GITHUB_REF_NAME"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push ghcr.io image
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/terraguard"
          docker build -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker push "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:latest" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
        id: push
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
      - name: Image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
