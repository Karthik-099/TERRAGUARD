# Runs only when engine/CLI/evals change. No schedules.
name: ci

on:
  pull_request:
    paths:
      - "engine/**"
      - "cmd/**"
      - "internal/**"
      - "web/embed.go"
      - "editors/**"
      - "stats-worker/**"
      - "scripts/**"
      - "schema/**"
      - "deploy/**"
      - "templates/**"
      - "Dockerfile"
      - "evals/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "action.yml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "cmd/**"
      - "internal/**"
      - "web/embed.go"
      - "editors/**"
      - "stats-worker/**"
      - "scripts/**"
      - "schema/**"
      - "deploy/**"
      - "templates/**"
      - "Dockerfile"
      - "evals/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "action.yml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: No credentials in the repository
        run: scripts/check-secrets.sh --all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet + unit tests
        run: make test
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Race detector
        run: go test -race ./...
      - name: Fuzz the scanner and policy loader (short)
        run: |
          go test ./engine -run '^$' -fuzz '^FuzzScan$' -fuzztime 30s
          go test ./engine -run '^$' -fuzz '^FuzzConfig$' -fuzztime 30s
      - name: Known vulnerabilities in dependencies and the Go toolchain
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: WebAssembly build
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - name: Rule evals (every labelled case)
        run: make evals
      - name: Rule reference is up to date
        run: make rules-doc && git diff --exit-code docs/RULES.md
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Stats worker unit tests
        run: cd stats-worker && npm test
      - name: Deployment templates pass TerraGuard (dogfood)
        run: for d in deploy/aws deploy/azure deploy/gcp; do bin/terraguard scan "$d" --fail-on MEDIUM; done
      - name: Helm chart
        run: helm lint deploy/helm/terraguard && helm template tg deploy/helm/terraguard > /dev/null
      - name: Example policy pack tests
        run: bin/terraguard policy test examples/policies/tests --config examples/policies/team-payments.yml
      - name: VS Code extension unit tests
        run: cd editors/vscode && npm test

  # Dogfood the composite action exactly as users consume it.
  action:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Hardened example must pass
        uses: ./
        with:
          path: examples/secure
          comment: "false"
          sarif: "false"
      - name: Vulnerable example must fail
        id: insecure
        uses: ./
        continue-on-error: true
        with:
          path: examples/insecure
          plan: examples/plan.json
          comment: "false"
          sarif: "false"
      - run: test "${{ steps.insecure.outputs.passed }}" = "false"
      - name: Pulse across all examples
        uses: ./
        with:
          command: pulse
          path: examples

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build self-hosted image
        run: docker build -t terraguard:ci .
      - name: Smoke test
        run: |
          docker run --rm -v "$PWD/examples:/src" -w /src terraguard:ci scan secure
          docker run -d --name tg -p 127.0.0.1:8080:8080 terraguard:ci
          for i in $(seq 1 20); do curl -fsS 127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS 127.0.0.1:8080/api/config
          curl -fsS -o /dev/null 127.0.0.1:8080/terraguard.wasm
