name: Bug report
description: Something does not work as documented (crash, wrong output, broken integration).
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `terraguard version`, or the web app's engine version.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [CLI, Web app, GitHub Action, VS Code, MCP server, Self-hosted server, Admission webhook, Other]
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest file or command that shows the problem. Remove secrets and real account IDs.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
