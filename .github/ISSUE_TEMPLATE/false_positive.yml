name: 🐞 False positive or bug
description: TerraGuard flagged something that is fine, missed something, or crashed
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: TG-AWS-SG-001
  - type: textarea
    id: snippet
    attributes:
      label: Terraform that reproduces it (remove secrets)
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options: [Web app, CLI, GitHub Action, MCP server]
