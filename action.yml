name: TerraGuard
description: Terraform security, apply-time validation, attack-path and plan-risk gate with SARIF and PR comments.
author: Karthik
branding:
  icon: shield
  color: orange

inputs:
  command:
    description: "scan (gate on all findings, default), review (gate only on findings a PR introduces; needs actions/checkout with fetch-depth 0) or pulse (control adoption, waivers and trend across many modules)."
    default: scan
  base:
    description: "review only: git revision to compare against. Defaults to the pull request's base commit."
    default: ""
  baseline:
    description: "pulse only: path to the previous pulse JSON, to report the trend."
    default: ""
  path:
    description: Directory (or file) with Terraform to scan.
    default: "."
  plan:
    description: Optional path to `terraform show -json tfplan` output.
    default: ""
  config:
    description: Optional path to .terraguard.yml (auto-detected in `path` otherwise).
    default: ""
  fail-on:
    description: CRITICAL | HIGH | MEDIUM | LOW | NONE. Overrides the policy file.
    default: ""
  comment:
    description: Post/update a single sticky PR comment with the report.
    default: "true"
  sarif:
    description: Upload SARIF to GitHub code scanning (inline annotations, Security tab).
    default: "true"
  ai:
    description: Add an LLM remediation plan to the comment. Needs GROQ_API_KEY, GEMINI_API_KEY or OPENROUTER_API_KEY in env.
    default: "false"

outputs:
  passed:
    description: "true when the policy gate passed."
    value: ${{ steps.scan.outputs.passed }}
  score:
    description: Security score 0-100.
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: A-F grade.
    value: ${{ steps.scan.outputs.grade }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build TerraGuard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/terraguard" ./cmd/terraguard

    - name: Pulse
      if: inputs.command == 'pulse'
      shell: bash
      env:
        TG_PATH: ${{ inputs.path }}
        TG_BASELINE: ${{ inputs.baseline }}
      run: |
        args=(pulse "$TG_PATH" --json "$RUNNER_TEMP/pulse.json" --markdown "$RUNNER_TEMP/pulse.md")
        [ -n "$TG_BASELINE" ] && args+=(--baseline "$TG_BASELINE")
        "$RUNNER_TEMP/terraguard" "${args[@]}" > /dev/null
        cat "$RUNNER_TEMP/pulse.md" >> "$GITHUB_STEP_SUMMARY"
        echo "Pulse JSON: $RUNNER_TEMP/pulse.json (upload it as an artifact and pass it as baseline next run)"

    - name: Scan
      id: scan
      if: inputs.command != 'pulse'
      shell: bash
      env:
        TG_PATH: ${{ inputs.path }}
        TG_PLAN: ${{ inputs.plan }}
        TG_CONFIG: ${{ inputs.config }}
        TG_FAIL_ON: ${{ inputs.fail-on }}
        TG_AI: ${{ inputs.ai }}
        TG_COMMAND: ${{ inputs.command }}
        TG_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        if [ "$TG_COMMAND" = "review" ]; then
          args=(review "$TG_PATH" --base "${TG_BASE:-origin/main}" --markdown "$RUNNER_TEMP/terraguard.md" --json "$RUNNER_TEMP/terraguard.json")
        else
          args=(scan "$TG_PATH" --format text --sarif "$RUNNER_TEMP/terraguard.sarif" --markdown "$RUNNER_TEMP/terraguard.md" --json "$RUNNER_TEMP/terraguard.json")
          [ -n "$TG_PLAN" ] && args+=(--plan "$TG_PLAN")
        fi
        [ -n "$TG_CONFIG" ] && args+=(--config "$TG_CONFIG")
        [ -n "$TG_FAIL_ON" ] && args+=(--fail-on "$TG_FAIL_ON")
        [ "$TG_AI" = "true" ] && args+=(--ai)
        set +e
        "$RUNNER_TEMP/terraguard" "${args[@]}"
        code=$?
        set -e
        [ $code -ge 2 ] && exit $code
        echo "passed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "score=$(jq -r '.score // empty' "$RUNNER_TEMP/terraguard.json")" >> "$GITHUB_OUTPUT"
        echo "grade=$(jq -r '.grade // .tier' "$RUNNER_TEMP/terraguard.json")" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/terraguard.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF
      if: inputs.command == 'scan' && inputs.sarif == 'true'
      # Code scanning needs GitHub Advanced Security on private repos; never fail the gate on it.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/terraguard.sarif
        category: terraguard

    - name: Sticky PR comment
      if: inputs.command != 'pulse' && inputs.comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$RUNNER_TEMP/comment.md"
        { echo "<!-- terraguard -->"; cat "$RUNNER_TEMP/terraguard.md"; } > "$body"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- terraguard -->")) | .id' | head -1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
        fi

    - name: Policy gate
      if: inputs.command != 'pulse' && steps.scan.outputs.passed != 'true'
      shell: bash
      run: |
        echo "::error title=TerraGuard::Policy failed (grade ${{ steps.scan.outputs.grade }}, score ${{ steps.scan.outputs.score }}). See the job summary."
        exit 1
