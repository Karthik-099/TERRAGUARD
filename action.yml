name: TerraGuard
description: Terraform security, apply-time validation, attack-path and plan-risk gate with SARIF and PR comments.
author: Karthik
branding:
  icon: shield
  color: orange

inputs:
  command:
    description: "scan (gate on all findings, default), review (gate only on findings a PR introduces; needs actions/checkout with fetch-depth 0), pulse (control adoption, waivers and trend across many modules) or preflight (check the plan against live cloud quotas and bucket names; needs plan and read-only cloud credentials)."
    default: scan
  base:
    description: "review only: git revision to compare against. Defaults to the pull request's base commit."
    default: ""
  baseline:
    description: "pulse only: path to the previous pulse JSON, to report the trend."
    default: ""
  path:
    description: Directory (or file) with Terraform to scan.
    default: "."
  plan:
    description: Optional path to `terraform show -json tfplan` output.
    default: ""
  annotations:
    description: "scan only: also show findings as annotations on the pull request's files (works without code scanning)."
    default: "true"
  headroom:
    description: "preflight only: percent of each quota to keep spare for other pipelines (for example 20)."
    default: "0"
  schema:
    description: Optional path to `terraform providers schema -json` output; checks every argument against the provider.
    default: ""
  config:
    description: Optional path to .terraguard.yml (auto-detected in `path` otherwise).
    default: ""
  fail-on:
    description: CRITICAL | HIGH | MEDIUM | LOW | NONE. Overrides the policy file.
    default: ""
  comment:
    description: Post/update a single sticky PR comment with the report.
    default: "true"
  pr-comments:
    description: "On pull_request events, post findings on changed lines as one pull-request review, with a GitHub suggestion when TerraGuard has a safe fix. Needs `permissions: pull-requests: write` and actions/checkout with fetch-depth 0. Replaces the previous TerraGuard review; a failure to post only prints a warning."
    default: "false"
  sarif:
    description: Upload SARIF to GitHub code scanning (inline annotations, Security tab).
    default: "true"
  frameworks:
    description: Comma-separated formats to scan (terraform, kubernetes, cloudformation, serverless, arm, dockerfile, docker-compose, github-actions, gitlab-ci, azure-pipelines, circleci, bitbucket-pipelines, ansible, openapi). Empty means all.
    default: ""
  args:
    description: Extra scan flags, space-separated, for example "--helm --rego policies/ --policy-dir graph-policies/".
    default: ""
  ai:
    description: Add an LLM remediation plan to the comment. Needs GROQ_API_KEY, GEMINI_API_KEY or OPENROUTER_API_KEY in env.
    default: "false"

outputs:
  passed:
    description: "true when the policy gate passed."
    value: ${{ steps.scan.outputs.passed }}
  score:
    description: Security score 0-100.
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: A-F grade.
    value: ${{ steps.scan.outputs.grade }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build TerraGuard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/terraguard" ./cmd/terraguard

    - name: Pulse
      if: inputs.command == 'pulse'
      shell: bash
      env:
        TG_PATH: ${{ inputs.path }}
        TG_BASELINE: ${{ inputs.baseline }}
      run: |
        args=(pulse "$TG_PATH" --json "$RUNNER_TEMP/pulse.json" --markdown "$RUNNER_TEMP/pulse.md")
        [ -n "$TG_BASELINE" ] && args+=(--baseline "$TG_BASELINE")
        "$RUNNER_TEMP/terraguard" "${args[@]}" > /dev/null
        cat "$RUNNER_TEMP/pulse.md" >> "$GITHUB_STEP_SUMMARY"
        echo "Pulse JSON: $RUNNER_TEMP/pulse.json (upload it as an artifact and pass it as baseline next run)"

    - name: Preflight
      if: inputs.command == 'preflight'
      shell: bash
      env:
        TG_PLAN: ${{ inputs.plan }}
        TG_HEADROOM: ${{ inputs.headroom }}
      run: |
        [ -n "$TG_PLAN" ] || { echo "preflight needs the plan input (terraform show -json output)"; exit 2; }
        set +e
        "$RUNNER_TEMP/terraguard" preflight --plan "$TG_PLAN" --live --headroom "${TG_HEADROOM:-0}" --markdown "$RUNNER_TEMP/preflight.md"
        code=$?
        cat "$RUNNER_TEMP/preflight.md" >> "$GITHUB_STEP_SUMMARY"
        exit $code

    - name: Scan
      id: scan
      if: inputs.command != 'pulse' && inputs.command != 'preflight'
      shell: bash
      env:
        TG_PATH: ${{ inputs.path }}
        TG_PLAN: ${{ inputs.plan }}
        TG_SCHEMA: ${{ inputs.schema }}
        TG_CONFIG: ${{ inputs.config }}
        TG_FAIL_ON: ${{ inputs.fail-on }}
        TG_AI: ${{ inputs.ai }}
        TG_FRAMEWORKS: ${{ inputs.frameworks }}
        TG_ARGS: ${{ inputs.args }}
        TG_COMMAND: ${{ inputs.command }}
        TG_ANNOTATIONS: ${{ inputs.annotations }}
        TG_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        if [ "$TG_COMMAND" = "review" ]; then
          args=(review "$TG_PATH" --base "${TG_BASE:-origin/main}" --markdown "$RUNNER_TEMP/terraguard.md" --json "$RUNNER_TEMP/terraguard.json")
        else
          args=(scan "$TG_PATH" --format text --sarif "$RUNNER_TEMP/terraguard.sarif" --markdown "$RUNNER_TEMP/terraguard.md" --json "$RUNNER_TEMP/terraguard.json")
          [ -n "$TG_PLAN" ] && args+=(--plan "$TG_PLAN")
        fi
        [ -n "$TG_SCHEMA" ] && args+=(--schema "$TG_SCHEMA")
        if [ "$TG_COMMAND" != "review" ]; then
          [ -n "$TG_FRAMEWORKS" ] && args+=(--framework "$TG_FRAMEWORKS")
          if [ -n "$TG_ARGS" ]; then read -r -a extra <<< "$TG_ARGS"; args+=("${extra[@]}"); fi
        fi
        [ -n "$TG_CONFIG" ] && args+=(--config "$TG_CONFIG")
        [ -n "$TG_FAIL_ON" ] && args+=(--fail-on "$TG_FAIL_ON")
        [ "$TG_AI" = "true" ] && args+=(--ai)
        set +e
        "$RUNNER_TEMP/terraguard" "${args[@]}"
        code=$?
        # Repeat with --format github (the last --format wins) to print annotations.
        [ "$TG_COMMAND" = "scan" ] && [ "$TG_ANNOTATIONS" = "true" ] && "$RUNNER_TEMP/terraguard" "${args[@]}" --format github
        set -e
        [ $code -ge 2 ] && exit $code
        echo "passed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "score=$(jq -r '.score // empty' "$RUNNER_TEMP/terraguard.json")" >> "$GITHUB_OUTPUT"
        echo "grade=$(jq -r '.grade // .tier' "$RUNNER_TEMP/terraguard.json")" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/terraguard.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF
      if: inputs.command == 'scan' && inputs.sarif == 'true'
      # Code scanning needs GitHub Advanced Security on private repos; never fail the gate on it.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
      with:
        sarif_file: ${{ runner.temp }}/terraguard.sarif
        category: terraguard

    - name: Sticky PR comment
      if: inputs.command != 'pulse' && inputs.command != 'preflight' && inputs.comment == 'true' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        body="$RUNNER_TEMP/comment.md"
        { echo "<!-- terraguard -->"; cat "$RUNNER_TEMP/terraguard.md"; } > "$body"
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- terraguard -->")) | .id' | head -1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" >/dev/null
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
        fi

    - name: PR review with suggested fixes
      if: inputs.pr-comments == 'true' && inputs.command != 'pulse' && inputs.command != 'preflight' && github.event_name == 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TG_PATH: ${{ inputs.path }}
        TG_CONFIG: ${{ inputs.config }}
        TG_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        # Never fail the job here: every problem is a warning.
        set +e
        warn() { echo "::warning title=TerraGuard::$1"; }
        marker='<!-- terraguard-review -->'
        bot='github-actions[bot]'
        pulls="repos/$GITHUB_REPOSITORY/pulls"
        review="$RUNNER_TEMP/terraguard-review.json"
        args=(review "$TG_PATH" --base "${TG_BASE:-origin/main}" --format github-review --out "$review")
        [ -n "$TG_CONFIG" ] && args+=(--config "$TG_CONFIG")
        "$RUNNER_TEMP/terraguard" "${args[@]}" > /dev/null
        if ! jq -e '.event == "COMMENT"' "$review" > /dev/null 2>&1; then
          warn "Could not build the pull-request review (is the base commit fetched? use fetch-depth: 0)."
          exit 0
        fi
        new_id=""
        if [ "$(jq '.comments | length' "$review")" -gt 0 ]; then
          jq --arg c "$HEAD_SHA" '. + {commit_id: $c}' "$review" > "$review.post"
          new_id=$(gh api -X POST "$pulls/$PR/reviews" --input "$review.post" --jq '.id')
          [ -n "$new_id" ] || warn "Could not post the pull-request review. It needs permissions: pull-requests: write, and lines that are in the pull request's diff."
        else
          echo "No new finding on a changed line; no review posted."
        fi
        # Then retire older TerraGuard reviews: delete their inline comments and mark their summaries superseded.
        [ -n "$new_id" ] || new_id=0
        gh api "$pulls/$PR/comments" --paginate | jq -r --arg m "$marker" --arg b "$bot" --argjson keep "$new_id" \
          '.[] | select(.user.login == $b and (.body | contains($m)) and .pull_request_review_id != $keep) | .id' |
          while read -r id; do
            gh api -X DELETE "$pulls/comments/$id" > /dev/null || warn "Could not delete an earlier TerraGuard review comment."
          done
        gh api "$pulls/$PR/reviews" --paginate | jq -r --arg m "$marker" --arg b "$bot" --argjson keep "$new_id" \
          '.[] | select(.user.login == $b and (.body | contains($m)) and .id != $keep) | .id' |
          while read -r id; do
            gh api -X PUT "$pulls/$PR/reviews/$id" -f body='<!-- terraguard-review-superseded -->Superseded by a newer TerraGuard review.' > /dev/null ||
              warn "Could not mark an earlier TerraGuard review as superseded."
          done
        exit 0

    - name: Policy gate
      if: inputs.command != 'pulse' && inputs.command != 'preflight' && steps.scan.outputs.passed != 'true'
      shell: bash
      run: |
        echo "::error title=TerraGuard::Policy failed (grade ${{ steps.scan.outputs.grade }}, score ${{ steps.scan.outputs.score }}). See the job summary."
        exit 1
