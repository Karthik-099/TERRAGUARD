{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "terraguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "terraguard.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.allowedNamespaceLabels }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .Values.service.port }}
{{- end }}
