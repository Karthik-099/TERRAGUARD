apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "terraguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "terraguard.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
