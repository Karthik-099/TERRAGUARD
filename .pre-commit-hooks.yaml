# Use from any repo's .pre-commit-config.yaml:
#   - repo: https://github.com/Karthik-099/TERRAGUARD
#     rev: v3.0.0
#     hooks:
#       - id: terraguard
#       - id: terraguard-fix        # optional: apply safe auto-fixes first
- id: terraguard
  name: TerraGuard scan
  description: Security, apply-time validation and policy gate for Terraform, Kubernetes, CloudFormation, ARM, Dockerfiles, CI pipelines and more.
  entry: terraguard scan
  language: golang
  files: \.(tf|tofu|tfvars|ya?ml|json|template|dockerfile)$|(^|/)(Dockerfile[^/]*|Containerfile|terragrunt\.hcl)$
  pass_filenames: false
  args: ["."]

- id: terraguard-fix
  name: TerraGuard auto-fix
  description: Apply safe auto-fixes before committing.
  entry: terraguard fix
  language: golang
  files: \.(tf|tfvars)$
  pass_filenames: false
  args: ["."]
